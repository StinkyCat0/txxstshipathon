

services:
  expo-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wanderly-expo
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo dev server
      - "19001:19001" # Metro reporter
      - "19002:19002" # Packager
    volumes:
      # Live code sync
      - .:/app
      # Keep node_modules in container
      - /app/node_modules
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true
    command: npx expo start --tunnel --clear
